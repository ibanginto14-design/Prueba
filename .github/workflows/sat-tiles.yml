name: sat-tiles
on:
  push:
    branches: [sat-tiles-tmp]
    paths: ['sat/osm.py','.github/workflows/sat-tiles.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python sat/osm.py || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sat/out/osm_churches.json sat/out/osm_log.txt || true
          git commit -m "osm churches [skip ci]"
          git push
